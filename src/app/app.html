<div style="padding: 20px; font-family: sans-serif; max-width: 400px;">
  <h2>Cadastro de Alunos</h2>
  

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold;">Nome do aluno:</label>
    <input type="text" [(ngModel)]="nome" style="width: 100%; padding: 5px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold;">Idade:</label>
    <input type="number" [(ngModel)]="idade" style="width: 100%; padding: 5px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold;">Curso:</label>
    <input type="text" [(ngModel)]="curso" style="width: 100%; padding: 5px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold;">E-mail:</label>
    <input type="email" [(ngModel)]="email" style="width: 100%; padding: 5px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold;">Cidade:</label>
    <input type="text" [(ngModel)]="cidade" style="width: 100%; padding: 5px;">
  </div>

 <button (click)="restaurarDados()">
  Restaurar Dados
</button>

  <hr>

 
  <h3>Dados do Aluno</h3>
  <p><strong>Nome:</strong> {{ nome }}</p>
  <p><strong>Idade:</strong> {{ idade }}</p>
  <p><strong>Curso:</strong> {{ curso }}</p>
  <p><strong>E-mail:</strong> {{ email }}</p>
  <p><strong>Cidade:</strong> {{ cidade }}</p>
</div>
